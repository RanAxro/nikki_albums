name: nikki_albums_generator
description: nikki_albums 使用的代码生成器，根据 AppStateDefine 等注解生成 Dart 代码。
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  analyzer: ">=8.1.1 <15.0.0"
  build: ">=3.0.2 <5.0.0"
  source_gen: ">=4.0.0 <5.0.0"
  nikki_albums_annotation:
    path: ../nikki_albums_annotation

dev_dependencies:
  build_runner: ^2.15.1
